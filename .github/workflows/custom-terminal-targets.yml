name: Custom desktop terminal targets

on:
  push:
    branches: [feature/interactive-terminal-targets]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-targets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'MVK-automated/hermes-agent'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      HERMES_BUILD_COMMIT: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install desktop workspace dependencies
        run: npm ci --workspace apps/desktop --include-workspace-root --no-audit --no-fund
      - name: Type checks
        working-directory: apps/desktop
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.electron.json --noEmit
      - name: Terminal regression tests
        working-directory: apps/desktop
        run: npx vitest run electron/terminal-target.test.ts electron/terminal-target-ipc.test.ts electron/terminal-ipc.test.ts electron/terminal-pty-dispose.test.ts electron/terminal-output-gate.test.ts src/app/right-sidebar/terminal/rail-target.test.tsx src/app/right-sidebar/terminal/terminals.test.ts
      - name: Build desktop
        run: npm run build --workspace apps/desktop
      - name: Prepare native dependencies for target runner
        working-directory: apps/desktop
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            node scripts/stage-native-deps.mjs --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/hermes-terminal-native-deps" --platform darwin --arch arm64
          else
            node scripts/stage-native-deps.mjs --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/hermes-terminal-native-deps" --platform win32 --arch x64
          fi
      - name: Package macOS Apple Silicon
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: npm run builder -- --native-deps "$RUNNER_TEMP/hermes-terminal-native-deps" --mac zip --arm64 --publish never
      - name: Package Windows x64 portable archive
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: npm run builder -- --native-deps "$RUNNER_TEMP/hermes-terminal-native-deps" --win zip --x64 --publish never
      - name: Upload custom build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-targets-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
